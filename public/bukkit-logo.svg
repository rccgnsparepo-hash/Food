<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bukkitSpeedOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FF4500" />
      <stop offset="100%" stopColor="#FF6A00" />
    </linearGradient>
    <linearGradient id="bukkitTopGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FF5A00" />
      <stop offset="65%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#FFFFFF" />
    </linearGradient>
    <filter id="bukkitDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" floodColor="#FF5A00" floodOpacity="0.35" />
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 10)">
    <!-- 1. Three Orange Speed Trails on Left -->
    <path d="M 50 68 L 115 68 C 119 68 122 71 122 75 C 122 79 119 82 115 82 L 50 82 C 45.5 82 42 78.5 42 75 C 42 71.5 45.5 68 50 68 Z" fill="url(#bukkitSpeedOrange)" />
    <path d="M 20 92 L 105 92 C 109 92 112 95 112 99 C 112 103 109 106 105 106 L 20 106 C 15.5 106 12 102.5 12 99 C 12 95.5 15.5 92 20 92 Z" fill="url(#bukkitSpeedOrange)" />
    <path d="M 48 116 L 98 116 C 102 116 105 119 105 123 C 105 127 102 130 98 130 L 48 130 C 43.5 130 40 126.5 40 123 C 40 119.5 43.5 116 48 116 Z" fill="url(#bukkitSpeedOrange)" />

    <!-- 2. Chef's Hat atop B -->
    <g transform="translate(102, 10)">
      <!-- Hat Puffs -->
      <path d="M 12 36 C 4 36 0 28 3 20 C 6 12 15 10 24 13 C 28 4 42 0 54 6 C 65 11 68 22 66 30 C 74 30 80 37 77 44 C 74 50 66 52 58 50 L 16 50 C 13 46 12 41 12 36 Z" fill="#FFFFFF" />
      <!-- Hat Brim Band -->
      <path d="M 18 42 L 68 42 C 72 42 74 45 73 48 L 71 54 C 70 56 68 58 64 58 L 14 58 C 10 58 8 56 9 54 L 11 48 C 12 45 15 42 18 42 Z" fill="#FFFFFF" opacity="0.95" />
      <path d="M 16 48 L 66 48" stroke="#FF5A00" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- 3. Slanted Capital 'B' with Lightning/Speed Slice Cutout -->
    <!-- Main Outer Body of 'B' -->
    <path d="M 108 58 C 104 58 100 62 98 67 L 76 150 C 74 156 79 160 85 160 L 145 160 C 168 160 186 148 189 128 C 191 114 184 103 172 97 C 180 91 184 81 182 71 C 179 58 165 58 148 58 L 108 58 Z" fill="url(#bukkitTopGlow)" filter="url(#bukkitDropShadow)" />

    <!-- Top Counter of 'B' -->
    <path d="M 122 74 L 144 74 C 153 74 159 78 158 85 C 157 91 150 94 141 94 L 117 94 L 122 74 Z" fill="#000000" />

    <!-- Bottom Counter of 'B' -->
    <path d="M 112 108 L 143 108 C 154 108 161 113 159 123 C 157 132 148 138 137 138 L 105 138 L 112 108 Z" fill="#000000" />

    <!-- Inner Lightning/Speed Notch in Vertical Spine -->
    <polygon points="104,80 120,80 110,104 124,104 98,144 106,108 94,108" fill="#000000" />
  </g>

  <!-- BUKKIT SLANTED WORDMARK -->
  <g transform="translate(230, 142) skewX(-14)">
    <text x="0" y="0" font-family="'Inter', 'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="108" fill="#FFFFFF" letter-spacing="4">BUKKIT</text>
  </g>
</svg>
