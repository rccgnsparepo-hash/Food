name: BUKKIT Electron Windows EXE CI/CD

on:
  push:
    branches: [ main, master, dev, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_package:
        description: 'Target Windows Package Format'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - nsis-installer
          - portable-exe
      target_arch:
        description: 'Target CPU Architecture'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - ia32
          - all
      release_tag:
        description: 'GitHub Release Tag (Leave blank for auto v1.0.<build_number>)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write

jobs:
  # ----------------------------------------------------------------------
  # Job: Build, Package, and Publish Windows Electron .EXE Applications
  # ----------------------------------------------------------------------
  build-windows-exe:
    name: Build Windows Executables (.exe)
    runs-on: windows-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies (Windows Native Binaries)
        shell: pwsh
        run: |
          Write-Host "Installing dependencies on Windows runner..."
          npm install --no-audit --no-fund --legacy-peer-deps --include=optional
          Write-Host "Ensuring Windows platform-specific binaries are resolved..."
          npm install --no-save --save-optional @rollup/rollup-win32-x64-msvc @esbuild/win32-x64 lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc || true

      - name: 4. Ensure Electron & Electron-Builder Tools
        shell: pwsh
        run: |
          npm install --no-save electron electron-builder

      - name: 5. Verify TypeScript Compilation & Linting
        shell: pwsh
        run: |
          npx tsc --noEmit

      - name: 6. Compile Production Web Assets for Desktop
        env:
          NODE_ENV: production
          ELECTRON: 'true'
        shell: pwsh
        run: |
          npm run build || npx vite build

      - name: 7. Package Electron Windows Executable with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          $TargetPkg = "${{ inputs.target_package }}"
          $TargetArch = "${{ inputs.target_arch }}"
          
          Write-Host "=================================================="
          Write-Host "Building BUKKIT Desktop for Windows"
          Write-Host "Target Format: $TargetPkg"
          Write-Host "Target Architecture: $TargetArch"
          Write-Host "=================================================="
          
          if ($TargetPkg -eq "portable-exe") {
            npx electron-builder --win portable --x64 --config electron/electron-builder.json
          } elseif ($TargetPkg -eq "nsis-installer") {
            npx electron-builder --win nsis --x64 --config electron/electron-builder.json
          } else {
            npx electron-builder --win nsis portable --x64 --config electron/electron-builder.json
          }

      - name: 8. Verify and Prepare Generated EXE Files
        id: prep_artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build-output\windows"
          
          $exeFiles = Get-ChildItem -Path "dist-electron\*.exe" -Recurse
          if ($exeFiles.Count -eq 0) {
            Write-Error "No .exe binaries found in dist-electron directory!"
            Get-ChildItem -Path "dist-electron" -Recurse | Select-Object FullName
            exit 1
          }
          
          Write-Host "Found $($exeFiles.Count) generated executable(s):"
          foreach ($file in $exeFiles) {
            Copy-Item -Path $file.FullName -Destination "build-output\windows\" -Force
            Write-Host "  -> $($file.Name) ($([math]::Round($file.Length / 1MB, 2)) MB)"
          }
          
          # Create Windows Manifest Metadata
          $manifest = @{
            applicationName = "BUKKIT — Campus Food Marketplace Desktop"
            appId = "com.faratech.bukkit.desktop"
            targetOS = "Windows (x64)"
            buildTimestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            gitCommit = "${{ github.sha }}"
            buildNumber = "${{ github.run_number }}"
            files = @($exeFiles | ForEach-Object { $_.Name })
          }
          $manifest | ConvertTo-Json -Depth 4 | Out-File -FilePath "build-output\windows\windows-manifest.json" -Encoding utf8
          
          # Compute SHA-256 Checksums
          Get-FileHash -Path "build-output\windows\*.exe" -Algorithm SHA256 | 
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | 
            Out-File -FilePath "build-output\windows\CHECKSUM-SHA256.txt" -Encoding utf8
          
          Write-Host "Checksums and manifests generated successfully."

      - name: 9. Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bukkit-windows-desktop-exe
          path: build-output\windows
          retention-days: 30

      - name: 10. Determine Release Tag and Title
        id: release_meta
        shell: pwsh
        run: |
          $runNum = "${{ github.run_number }}"
          $inputTag = "${{ inputs.release_tag }}"
          
          if ($inputTag -and $inputTag.Trim() -ne "") {
            $tag = $inputTag.Trim()
            $title = "BUKKIT Desktop Release $tag"
          } else {
            $tag = "v1.0.$runNum-desktop"
            $title = "BUKKIT Windows Desktop EXE (Build #$runNum)"
          }
          
          "tag_name=$tag" >> $env:GITHUB_OUTPUT
          "release_title=$title" >> $env:GITHUB_OUTPUT

      - name: 11. Publish GitHub Release (with .EXE Assets)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_title }}
          body: |
            ## 💻 BUKKIT Desktop Windows Executable (Build #${{ github.run_number }})

            Download the standalone Windows desktop executables below:

            | Format | Description | File |
            | :--- | :--- | :--- |
            | **Windows Installer** | Standard NSIS Setup wizard with Start Menu and Desktop shortcuts | 📦 `Bukkit-Setup-*.exe` |
            | **Portable Executable** | Zero-install standalone `.exe`, double-click and run directly | 🚀 `Bukkit-Portable-*.exe` |

            ---
            ### 🔐 Verification & Metadata
            - **Platform**: Windows 10 / 11 (64-bit x64)
            - **Commit**: `${{ github.sha }}`
            - **Build Trigger**: `${{ github.event_name }}`
            - Refer to attached `CHECKSUM-SHA256.txt` to verify file integrity.
          files: |
            build-output/windows/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 12. Output Pipeline Step Summary
        shell: pwsh
        run: |
          $summary = @"
          ### 🚀 BUKKIT Desktop Windows (.EXE) Build Summary
          
          | Package Type | Target OS | File Output |
          | :--- | :--- | :--- |
          | **NSIS Installer** | Windows 10 / 11 (x64) | \`Bukkit-Setup-*.exe\` |
          | **Portable Standalone** | Windows 10 / 11 (x64) | \`Bukkit-Portable-*.exe\` |
          
          Status: **Build Successful**. Executables ready in workflow artifacts and GitHub Releases.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
