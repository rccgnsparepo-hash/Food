name: BUKKIT Multi-Flavor Android APK CI/CD

on:
  push:
    branches: [ main, master, dev, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_flavor:
        description: 'Target APK Variant to Build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - customer
          - vendor
          - rider
          - admin
      build_type:
        description: 'Build Type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      release_tag:
        description: 'GitHub Release Tag (Leave blank for auto v1.0.<build_number>)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write

jobs:
  # ----------------------------------------------------------------------
  # Job 1: Build & Package Matrix for the 4 Dedicated BUKKIT APK Flavors
  # ----------------------------------------------------------------------
  build-apk-flavor:
    name: Build APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: customer
            package_id: com.faratech.bukkit.customer
            app_name: "BUKKIT"
            scheme: "bukkit"
            role: "customer"
            notification_channel: "bukkit_order_updates"
          - flavor: vendor
            package_id: com.faratech.bukkit.vendor
            app_name: "BUKKIT Kitchen"
            scheme: "bukkit-vendor"
            role: "kitchen"
            notification_channel: "bukkit_kitchen_orders"
          - flavor: rider
            package_id: com.faratech.bukkit.rider
            app_name: "BUKKIT Rider"
            scheme: "bukkit-rider"
            role: "rider"
            notification_channel: "bukkit_delivery_dispatches"
          - flavor: admin
            package_id: com.faratech.bukkit.admin
            app_name: "BUKKIT Admin"
            scheme: "bukkit-admin"
            role: "admin"
            notification_channel: "bukkit_ops_alerts"

    steps:
      - name: Check if flavor should run
        id: check_run
        run: |
          TARGET="${{ inputs.target_flavor || 'all' }}"
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "${{ matrix.flavor }}" ] || [ -z "$TARGET" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: 1. Checkout Shared Source Repository
        if: steps.check_run.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment (v22 LTS)
        if: steps.check_run.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Setup Android SDK
        if: steps.check_run.outputs.should_run == 'true'
        uses: android-actions/setup-android@v3

      - name: 4. Setup Java JDK 21 (Temurin)
        if: steps.check_run.outputs.should_run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 5. Install Dependencies
        if: steps.check_run.outputs.should_run == 'true'
        run: npm install --no-audit --no-fund

      - name: 6. Verify TypeScript Compilation
        if: steps.check_run.outputs.should_run == 'true'
        run: npx tsc --noEmit

      - name: 7. Compile Flavor Web Assets
        if: steps.check_run.outputs.should_run == 'true'
        env:
          NODE_ENV: production
          VITE_BUKKIT_APP_VARIANT: ${{ matrix.flavor }}
          VITE_BUKKIT_PACKAGE_NAME: ${{ matrix.package_id }}
          VITE_BUKKIT_APP_NAME: ${{ matrix.app_name }}
          VITE_BUKKIT_DEEP_LINK_SCHEME: ${{ matrix.scheme }}
          VITE_BUKKIT_ALLOWED_ROLE: ${{ matrix.role }}
        run: |
          echo "=================================================="
          echo "Compiling BUKKIT Variant: ${{ matrix.flavor }}"
          echo "Package ID: ${{ matrix.package_id }}"
          echo "Application Name: ${{ matrix.app_name }}"
          echo "Deep Link Scheme: ${{ matrix.scheme }}://"
          echo "=================================================="
          npm run build

      - name: 8. Initialize & Configure Capacitor Android Project
        if: steps.check_run.outputs.should_run == 'true'
        env:
          VITE_BUKKIT_APP_VARIANT: ${{ matrix.flavor }}
          VITE_BUKKIT_PACKAGE_NAME: ${{ matrix.package_id }}
          VITE_BUKKIT_APP_NAME: ${{ matrix.app_name }}
        run: |
          # 1. Clean previous native project to ensure fresh configuration
          if [ ! -f "android/gradlew" ]; then
            echo "Generating fresh Capacitor Android project for ${{ matrix.flavor }}..."
            rm -rf android
            npx cap add android
          else
            echo "Existing Android project found. Updating..."
          fi

          # 2. Sync web assets into Android project
          npx cap sync android

          # 3. Setup Google Services JSON in android/app/
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
            echo "Copied google-services.json to android/app/"
          elif [ -f "android/app/google-services.json" ]; then
            echo "google-services.json already present in android/app/"
          fi

          # 4. Inject Google Services Gradle Plugin into android/build.gradle if missing
          if [ -f "android/build.gradle" ]; then
            if ! grep -q "com.google.gms:google-services" android/build.gradle; then
              echo "Injecting Google Services classpath into android/build.gradle..."
              sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
            fi
          fi

          # 5. Inject Google Services plugin into android/app/build.gradle if missing
          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
              echo "Injecting Google Services plugin into android/app/build.gradle..."
              echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            fi
          fi

          # 6. Apply Flavor-specific Branding (Icons, Colors, Strings)
          node scripts/generate-flavor-icons.js ${{ matrix.flavor }}

          # 7. Ensure AndroidManifest.xml includes deep links and permissions
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            echo "Verifying Android Manifest permissions and intent filters..."
            # Ensure POST_NOTIFICATIONS permission
            if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST_PATH"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.VIBRATE" />' "$MANIFEST_PATH"
            fi
            
            # Ensure Deep Link Scheme Intent Filter
            if ! grep -q "${{ matrix.scheme }}" "$MANIFEST_PATH"; then
              sed -i '/<\/activity>/i \            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="${{ matrix.scheme }}" />\n            </intent-filter>' "$MANIFEST_PATH"
            fi
          fi

      - name: 9. Build Native Android APK with Gradle
        if: steps.check_run.outputs.should_run == 'true'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          echo "Building APK for ${{ matrix.flavor }} with Java: $JAVA_HOME"
          cd android
          chmod +x gradlew
          
          BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: 10. Prepare Artifact Package
        if: steps.check_run.outputs.should_run == 'true'
        run: |
          mkdir -p build-output/${{ matrix.flavor }}
          
          # Find generated APK
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "build-output/${{ matrix.flavor }}/Bukkit-${{ matrix.flavor }}.apk"
            echo "Successfully packaged APK from $APK_PATH to Bukkit-${{ matrix.flavor }}.apk"
          else
            echo "WARNING: No APK found in android/app/build/outputs/apk!"
            ls -laR android/app/build/outputs/ || true
            exit 1
          fi
          
          # Generate metadata manifest
          cat <<EOF > build-output/${{ matrix.flavor }}/flavor-manifest.json
          {
            "flavor": "${{ matrix.flavor }}",
            "packageName": "${{ matrix.package_id }}",
            "appName": "${{ matrix.app_name }}",
            "deepLinkScheme": "${{ matrix.scheme }}",
            "primaryRole": "${{ matrix.role }}",
            "notificationChannel": "${{ matrix.notification_channel }}",
            "buildTimestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "buildType": "${{ inputs.build_type || 'debug' }}"
          }
          EOF
          
          cd build-output/${{ matrix.flavor }}
          sha256sum * > CHECKSUM-SHA256.txt 2>/dev/null || true

      - name: 11. Upload APK Artifact
        if: steps.check_run.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bukkit-${{ matrix.flavor }}-apk
          path: build-output/${{ matrix.flavor }}
          retention-days: 14

  # ----------------------------------------------------------------------
  # Job 2: Release Summary & GitHub Release Publisher
  # ----------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release & Summary
    needs: [ build-apk-flavor ]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    permissions:
      contents: write
      packages: write
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Download All APK Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bukkit-*-apk
          path: release-files
          merge-multiple: true
        continue-on-error: true

      - name: 3. Verify Gathered Release Files
        id: prep_release
        run: |
          mkdir -p release-files
          echo "Gathered release files:"
          ls -la release-files/ || true
          
          APK_COUNT=$(ls -1 release-files/*.apk 2>/dev/null | wc -l)
          echo "Found $APK_COUNT APKs ready for distribution."
          echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT

      - name: 4. Determine Tag and Release Name
        id: release_meta
        run: |
          RUN_NUM="${{ github.run_number }}"
          INPUT_TAG="${{ inputs.release_tag }}"
          
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            TITLE="BUKKIT Release $INPUT_TAG"
          else
            TAG="v1.0.${RUN_NUM}"
            TITLE="BUKKIT Multi-Flavor APKs (Build #${RUN_NUM})"
          fi
          
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "release_title=$TITLE" >> $GITHUB_OUTPUT

      - name: 5. Publish GitHub Release (with APK Assets)
        if: steps.prep_release.outputs.apk_count != '0' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_title }}
          body: |
            ## 📱 BUKKIT Native Android APKs (Build #${{ github.run_number }})

            Download the ready-to-install Android APKs below:

            | Flavor | Application ID | Target User / Role | APK Package |
            | :--- | :--- | :--- | :--- |
            | **Customer** | `com.faratech.bukkit.customer` | Customer Ordering | 📦 `Bukkit-customer.apk` |
            | **Vendor / Kitchen** | `com.faratech.bukkit.vendor` | Merchant Kitchen Operations | 📦 `Bukkit-vendor.apk` |
            | **Rider** | `com.faratech.bukkit.rider` | Courier Dispatch & GPS Tracking | 📦 `Bukkit-rider.apk` |
            | **Admin** | `com.faratech.bukkit.admin` | Platform Admin Console | 📦 `Bukkit-admin.apk` |

            ---
            - **Build Type**: `${{ inputs.build_type || 'debug' }}`
            - **Commit**: `${{ github.sha }}`
            - **Trigger**: `${{ github.event_name }}`
          files: |
            release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 6. Output Pipeline Summary
        run: |
          echo "### 🚀 BUKKIT 4-APK Native Architecture Build & Release" >> $GITHUB_STEP_SUMMARY
          echo "| Flavor | Application ID | Target Role | Deep Link Scheme | Notification Channel |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Customer** | \`com.faratech.bukkit.customer\` | Customer | \`bukkit://\` | \`bukkit_order_updates\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Vendor/Kitchen** | \`com.faratech.bukkit.vendor\` | Kitchen / Stand | \`bukkit-vendor://\` | \`bukkit_kitchen_orders\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Rider** | \`com.faratech.bukkit.rider\` | Delivery Courier | \`bukkit-rider://\` | \`bukkit_delivery_dispatches\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Admin** | \`com.faratech.bukkit.admin\` | Ops / Admin Console | \`bukkit-admin://\` | \`bukkit_ops_alerts\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Status: Complete. Generated APKs attached to artifacts and GitHub Releases." >> $GITHUB_STEP_SUMMARY
